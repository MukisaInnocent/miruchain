<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MIRUCHAIN</title>

    <!-- Design System -->
    <link rel="stylesheet" href="css/design-system.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        /* Background Pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 25%);
            z-index: -1;
        }

        .auth-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .auth-card::top {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .auth-icon {
            width: 64px;
            height: 64px;
            background: var(--primary-bg);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.5rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2rem;
            transition: all var(--transition-fast);
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left mr-xs"></i> Back to Login
        </a>

        <div class="text-center mb-xl">
            <div class="auth-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="h3 mb-xs">Forgot Password?</h1>
            <p class="text-secondary">Enter your email address to reset your password.</p>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <form id="forgotPasswordForm" onsubmit="event.preventDefault(); submitReset();">
            <div class="form-group mb-lg">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group relative">
                    <i
                        class="fa-solid fa-envelope input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-tertiary"></i>
                    <input type="email" id="email" class="form-input pl-xl" style="padding-left: 2.75rem;"
                        placeholder="john@example.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full" id="submitBtn">
                Send Reset Link <i class="fa-solid fa-paper-plane ml-xs"></i>
            </button>
        </form>

        <div class="text-center mt-xl pt-lg border-t border-color">
            <p class="text-secondary text-sm">
                Remember your password? <a href="login.html" class="text-primary font-semibold hover:underline">Login
                    here</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script>
        // Check for theme consistency
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        async function submitReset() {
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const alertContainer = document.getElementById('alertContainer');

            // Reset alert
            alertContainer.innerHTML = '';

            // Loading state
            miruchain.showLoading(submitBtn, 'Sending...');

            try {
                const response = await api.forgotPassword(email);

                alertContainer.innerHTML = `
                    <div class="alert alert-success flex items-start gap-sm mb-lg">
                        <i class="fa-solid fa-circle-check mt-xs"></i>
                        <div>
                            <strong>Success!</strong>
                            <p class="text-sm mt-xxs">${response.message || 'Password reset link sent to your email.'}</p>
                        </div>
                    </div>
                `;

                document.getElementById('forgotPasswordForm').reset();

            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-error flex items-start gap-sm mb-lg">
                        <i class="fa-solid fa-circle-exclamation mt-xs"></i>
                        <div>
                            <strong>Error</strong>
                            <p class="text-sm mt-xxs">${error.message || 'Failed to send reset link. Please try again.'}</p>
                        </div>
                    </div>
                `;
            } finally {
                miruchain.hideLoading(submitBtn, 'Send Reset Link <i class="fa-solid fa-paper-plane ml-xs"></i>');
            }
        }
    </script>
</body>

</html>
